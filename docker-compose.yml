services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: http://localhost:3000
      TELEMETRY_DB: /app/data/telemetry/telemetry.db
    ports: ["8000:8000"]
    depends_on: [qdrant]
    volumes: ["./data/telemetry:/app/data/telemetry"]

  web:
    build:
      context: frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  qdrant_data:
