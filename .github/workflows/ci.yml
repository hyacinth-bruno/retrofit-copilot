name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      EMBEDDING_BACKEND: hash   # offline and deterministic in CI
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: python -m pytest
      - name: Offline evals (retrieval + guardrails), fail below threshold
        run: python -m evals.run_evals --gate
      - name: LLM evals (only when the secret is configured)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: python -m evals.run_evals --llm --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: backend/evals/reports/latest.json }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
